<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JPEG Events – Settings</title>
  <script src="../Global/auth-util.js"></script>
  <script src="../Global/Theme.js"></script>
  <link rel="stylesheet" href="staff.css" />
  <link rel="stylesheet" href="../Global/profile.css" />
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">
    <img src="../Images/tickets.png" class="sidebar-logo" alt="Logo" />
    JPEG EVENTS
  </div>
  <div class="user-info">
    <span id="usernameDisplay"></span>
    <div class="avatar" id="avatar"></div>
  </div>
</div>

<!-- CONTAINER -->
<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="menu-item">
      <img src="../Images/Dashboard.png" class="icons" alt="Dashboard"></img>
      <a href="Staff-Dashboard.html" class="Side-Items">Tickets</a>
    </div>
    <div class="menu-item active">
      <img src="../Images/Settings.png" class="icons" alt="Settings"></img>
      <a href="Staff-Settings.html" class="Side-Items">Settings</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- SETTINGS CATEGORIES -->
    <div class="settings-container">

      <!-- Preferences -->
      <div class="settings-category">
        <div class="settings-header" data-target="preferencesSection">
          Preferences <span class="arrow">▼</span>
        </div>
        <div class="settings-content" id="preferencesSection">
          <label>Theme</label>
          <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <div id="previewArea" class="card">
            <h3>Preview</h3>
            <p>This is how your theme will look.</p>
            <button>Sample Button</button>
           </div>
          <button class="save-category-btn" data-category="preferencesSection">Save Preferences</button>
        </div>
      </div>

    </div>
    <!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
  <div class="modal-overlay"></div>
  <div class="profile-modal-card">
    <div class="profile-avatar-preview" id="profileAvatarPreview"></div>
    <input type="file" id="profileImageInput" accept="image/*" style="display:none"/>
    <p id="profileName">Loading...</p>
    <p id="profileEmail">Loading...</p>
    <div class="profile-actions">
      <button id="saveProfileBtn">Save</button>
      <button id="closeProfileBtn">Close</button>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </div>
</div>

<script src="Staff-Settings.js"></script>
<script src="../Global/profile.js"></script>

</body>
</html>
